# Co(II) + ONE imidazole, UNBOUND leg: alpha-TI in the PMF's plateau shell,
# to validate the plateau (dG_unbound) correction applied to the bound-state
# TI (configs/co_imid1_alpha_ti.yaml) and by lig1264.mbar.
#
# Same system blocks and alpha ladder (1.09 -> 4.5, 11 uniform windows, 2 ns)
# as the bound run.  Differences:
#   * the ion is placed 9.41 A from NE2 (shell centre) and prep holds it
#     there, instead of bound at 2.1 A;
#   * windows carry a flat-bottom restraint keeping d(Co, NE2) in
#     cv_walls_A = runs/pmf/co_imid1_a109's plateau shell (the last 15% of
#     mbar's 200 bins: 8.823-10.000 A, run_TI.plateau_shell), and analyze
#     keeps only frames inside it.  Zero force inside and lambda-independent,
#     so the TI is exactly dG_unbound over the shell-conditional ensemble.
# analyze -> unbound_check.csv: TI (all alpha pairs, incl. Cl- <-> NE2) vs
# plateau_shift (c/r^4, r^2-weighted, Co-NE2 only) vs mbar's dG_plateau, with
# the TI split into the Co-NE2 part (c/r^4 on the sampled r) and the rest.
name: co_imid1_alpha_ti_unbound

ion:
  element: Co
  charge: 2
  near_atom: NE2
  distance_A: 9.41       # shell centre: built dissociated, not bound

ligand:
  pdb: ligands/imidazole/imidazole.pdb
  resnames: [IMIA]
  count: 1

c4:
  alpha_by_class:
    NG2R50: 1.09         # alpha0: the system is BUILT at this value
  scale_by_class: {}
  zero_other_classes: true
  lambda_c4: 1.0

box:
  shape: octahedron
  diameter_A: 44.5
  water: spce
  neutralize: true

md:
  temperature_K: 300
  pressure_bar: 1
  cutoff_nm: 1.0
  constraints: HBonds
  friction_per_ps: 1.0
  min_restraint_k: 1000.0
  report_ps: 10

alpha_ti:
  cls: NG2R50
  alpha0: null           # -> c4.alpha_by_class.NG2R50 (1.09)
  alpha1: 4.5            # top of the ladder; every window is itself an alpha:
                         # 11 uniform windows -> alpha 1.09, 1.431, ..., 4.5
  n_windows: 11
  schedule: uniform      # uniform (cumulative TI + MBAR) | gauss_legendre (endpoint)
  dt_fs: 2.0
  min_max_iter: [20000, 20000, 20000]
  heat_ns: 1.0
  npt_ns: 2.0
  window_equil_ps: 200
  ns_per_window: 2.0
  dudl_every_ps: 0.5
  discard_frac: 0.1
  cv_atom: NE2
  cv_resid: null
  bound_r_max_A: 2.63   # PMF barrier top (runs/pmf/co_imid1_a109, WHAM 2026-10-14); monitor only
  max_unbound_frac: 0.05
  prep_restraint_kappa: 10.0
  prep_restraint_A: 9.41 # shell centre
  traj_ps: 0.0
  pmf_run: ligand-1264/runs/pmf/co_imid1_a109   # plateau correction (analysis only); relative to repo root
  plateau_frac: 0.15     # = lig1264.mbar --plateau-frac default
  cv_walls_A: [8.823, 10.0]   # co_imid1_a109 plateau shell (checked in analyze)
  cv_walls_kappa: 100.0  # kcal/mol/A^2 outside the shell

platform: CUDA
seed: 2031
